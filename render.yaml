# Render Blueprint for the Alexandria hub: one static site, alexandria-hub, in the Alexandria project,
# built from this repository's main branch and served only at alexdesignlab.org (Render redirects www
# to it). At Porkbun, alexdesignlab.org is an ALIAS and www a CNAME to the site's onrender.com address,
# which is otherwise switched off.
#
# Every tool lives under the one domain: /rhino, /grasshopper, /estimator/guide are hub pages, and
# /estimator/ is the Material Estimator itself, served from the alexandria-office site (the
# alexandria_office repo) through the rewrite below, so it still deploys from its own repo. Render
# applies a rule only where the hub has no page, so /estimator/guide stays the hub's.
services:
  - type: web
    name: alexandria-hub
    runtime: static
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - alexdesignlab.org
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_VERSION
        value: "24"                # Astro 7 needs Node 22.23.4 or later
    routes:
      # Render matches /estimator and /estimator/ alike, so the page gets its own rewrite (a redirect
      # between them loops); the Estimator's <base href="/estimator/"> keeps its files loading either way.
      - type: rewrite
        source: /estimator
        destination: https://alexandria-office.onrender.com/estimator/
      - type: rewrite
        source: /estimator/*
        destination: https://alexandria-office.onrender.com/estimator/*
      # the Color Matcher (/colors) and the Color Library (/colors/library), also from alexandria_office
      - type: rewrite
        source: /colors
        destination: https://alexandria-office.onrender.com/colors/
      - type: rewrite
        source: /colors/*
        destination: https://alexandria-office.onrender.com/colors/*
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow   # public for now, but not for search engines
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
