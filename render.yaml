# Render Blueprint for the Alexandria hub: one static site, built from this repository's main branch.
# Render created it as alexandria-hub-21kp (alexandria-hub-21kp.onrender.com). At Porkbun, alexdesignlab.org
# is an ALIAS and www a CNAME to that address; Render redirects www to the root.
services:
  - type: web
    name: alexandria-hub
    runtime: static
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - alexdesignlab.org
    envVars:
      - key: NODE_VERSION
        value: "24"                # Astro 7 needs Node 22.23.4 or later
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow   # public for now, but not for search engines
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
