# Render Blueprint for the Alexandria hub: one web service, alexandria-gate, in the Harker-Hub workspace, built
# from this repository's main branch and served at alexdesignlab.org (Render redirects www to it). At Porkbun,
# alexdesignlab.org is an ALIAS and www a CNAME to alexandria-gate.onrender.com, which is gated the same way.
#
# server/gate.mjs serves the built hub (dist/) and the office tools only to the people in HUB_USERS, who sign in
# once at /signin and stay signed in for 30 days; everyone else gets the sign-in page. The office tools (/estimator,
# /materials, /colors, /site-plan, /vectorizer, /grid, /braille, /sign-package) come from the private alexandria_office repo through
# server/office.mjs, at build time and then every two minutes, so a push there shows up without a hub deploy. A hub
# page wins over an office tool at the same address, so /estimator/guide stays the hub's.
#
# Until 2026-11-12 the hub was a public static site, alexandria-hub, with rewrites to the alexandria-office static
# site. Both are retired (suspended on Render, out of this file); nothing here points at them any more.
services:
  - type: web
    name: alexandria-gate
    runtime: node
    plan: starter                  # always on, so there's no wait for a sleeping instance
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build && node server/office.mjs
    startCommand: node server/gate.mjs
    healthCheckPath: /healthz
    domains:
      - alexdesignlab.org
    envVars:
      - key: NODE_VERSION
        value: "24"                # Astro 7 needs Node 22.23.4 or later
      # The secrets are set in this service's Environment on Render, never here.
      - key: HUB_USERS
        sync: false                # `name:passcode, name:passcode`; edit there to add or remove someone
      - key: GITHUB_TOKEN
        sync: false                # fine-grained, alexandria_office only, Contents read-only; expires 2027-11-12
      - key: SESSION_SECRET
        generateValue: true        # Render makes it once; it signs the 30-day sign-ins
