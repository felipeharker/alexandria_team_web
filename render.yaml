# Render Blueprint for the Alexandria hub: one static site, built from this repository's main branch.
# The custom domain goes under `domains` once it's set up at Porkbun (a CNAME to the onrender.com address).
services:
  - type: web
    name: alexandria-hub
    runtime: static
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"                # Astro 7 needs Node 22.23.4 or later
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow   # public for now, but not for search engines
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
