# Render Blueprint for this repository's two static sites, both built from main:
#
# - alexandria-hub: the hub at alexdesignlab.org (Render named it alexandria-hub-21kp). At Porkbun,
#   alexdesignlab.org is an ALIAS and www a CNAME to its onrender.com address; Render redirects www
#   to the root.
# - phoenix-guides: the two quick guides at phoenix.alexdesignlab.org/rhino and /grasshopper, written
#   by tools/build_phoenix.mjs. Its domain is added in Render once phoenix has a CNAME at Porkbun.
services:
  - type: web
    name: alexandria-hub
    runtime: static
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - alexdesignlab.org
    envVars:
      - key: NODE_VERSION
        value: "24"                # Astro 7 needs Node 22.23.4 or later
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow   # public for now, but not for search engines
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin

  - type: web
    name: phoenix-guides
    runtime: static
    repo: https://github.com/felipeharker/alexandria_team_web
    branch: main
    buildCommand: npm ci && npm run build:phoenix
    staticPublishPath: dist-phoenix
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
